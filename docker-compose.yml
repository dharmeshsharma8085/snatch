services:

  postgres:
    image: postgres:17

    container_name: snatch-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: snatch_db
      POSTGRES_USER: snatch_user
      POSTGRES_PASSWORD: snatch_dev_password

    ports:
       - "5433:5432"
    volumes:
      - snatch_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snatch_user -d snatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  snatch_postgres_data: